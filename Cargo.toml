[package]
name = "swc-plugin-ng-annotate"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
path = "swc-plugin/src/lib.rs"

[[test]]
name = "fixture"
path = "swc-plugin/tests/fixture.rs"

[dependencies]
swc_core = { version = "58", features = [
    "ecma_plugin_transform",
    "ecma_ast",
    "ecma_visit",
    "ecma_utils",
    "common",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[dev-dependencies]
swc_core = { version = "58", features = [
    "ecma_plugin_transform",
    "ecma_ast",
    "ecma_visit",
    "ecma_utils",
    "common",
    "ecma_parser",
    "testing_transform",
] }

[profile.release]
# This removes more dead code
codegen-units = 1
lto = true
# Optimize for size
opt-level = "s"
# Optimize for performance, this is default so you don't need to specify it
# opt-level = "z"
 
# Strip debug symbols
strip = "symbols"