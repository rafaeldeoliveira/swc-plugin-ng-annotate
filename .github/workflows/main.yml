name: main

on:
  push:
    branches:
      - fork
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - fork

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node:
          - '6'
          - '10'
          - '12'
          - '14'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
